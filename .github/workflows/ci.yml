name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo del lockfile.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # El build va al final porque es el paso lento: si algo falla antes, se ve antes.
      # Las variables son de pega: el build no habla con Supabase, solo necesita que
      # existan para no compilar el aviso de "falta configuración".
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-de-pega
